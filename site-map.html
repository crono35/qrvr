<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Campground Site Map | Quartzsite RV Resort</title>

  <meta
    name="description"
    content="View the campground site map for Quartzsite RV Resort in Quartzsite, Arizona."
  >

  <link rel="stylesheet" href="styles.css">

  <style>
    .map-page {
      text-align: center;
    }

    .campground-map {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 40px auto;
      width: 100%;
    }

    .campground-map img {
      display: block;
      width: auto;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
    }

    .map-actions {
      justify-content: center;
    }
  </style>

</head>

<body>

  <div id="site-header"></div>

  <main>

    <section class="section map-page">

      <div class="section-heading">
        <p class="eyebrow">Campground Layout</p>

        <h1>Quartzsite RV Resort Site Map</h1>

        <p>
          Use the map below to get familiar with the campground layout,
          RV sites, clubhouse, and property access.
        </p>
      </div>

      <div class="campground-map">
        <img
          src="images/sitemap.webp"
          alt="Quartzsite RV Resort campground site map"
        >
      </div>

      <div class="map-actions">
        <a class="button button-primary" href="https://www.campspot.com/book/quartzsite-rv-resort">
          Check Availability &amp; Book
        </a>

        <a class="button button-outline" href="index.html">
          Back to Home
        </a>
      </div>

    </section>

  </main>

  <div id="site-footer"></div>

  <script src="site.js"></script>

</body>
</html>
